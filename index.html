function cEdit(id){const e=EV.find(x=>x.id==id);if(!e)return;cEd={id,d:e.d.length==5?`${cm.getFullYear()}-${e.d}`:e.d,t:e.t,c:e.c||"blue",all:isAll(e)?1:0,s:e.s||"09:00",e:e.e||"10:00"};go("cal")}
function cSave(){if(!cEd||!/^\d{4}-\d\d-\d\d$/.test(cEd.d))return;const o={d:cEd.d,t:cEd.t.trim()||"새로운 이벤트",c:cEd.c};if(cEd.all)o.all=1;else{o.s=cEd.s||"09:00";o.e=cEd.e||"10:00"}if(cEd.id){const i=EV.findIndex(x=>x.id==cEd.id);if(i>=0)EV[i]={...o,id:cEd.id}}else EV.push({...o,id:"u"+Date.now()});const[yy,mm]=cEd.d.split("-").map(Number);cm=new Date(yy,mm-1,1);csel=cEd.d;cEd=null;evSave();go("cal")}
function cDel(){EV=EV.filter(x=>x.id!=cEd.id);cEd=null;evSave();go("cal")}

R.cal=()=>{const T=new Date(),tk=dkOf(T),y=cm.getFullYear(),m=cm.getMonth();
 if(cV=="y"){let g="";for(let i=0;i<12;i++){const f=new Date(y,i,1).getDay(),n=new Date(y,i+1,0).getDate();let c="<i></i>".repeat(f);for(let d=1;d<=n;d++)c+=`<i class="${dk(y,i,d)==tk?"t":""}">${d}</i>`;g+=`<div onclick="cm=new Date(${y},${i},1);csel=null;cV='m';go('cal')"><b class="${T.getFullYear()==y&&T.getMonth()==i?"c":""}">${i+1}월</b><div class="cxm">${c}</div></div>`}
  return wrap(`<div class="tr" style="padding:6px 16px 10px"><i class="fp" style="padding:0 16px 0 12px;gap:4px" onclick="cV='m';go('cal')">${ic("back",20)}</i><span class="fp" style="padding:0 20px;gap:26px"><span onclick="cAdd()">${svgs.plus}</span></span></div><div class="cxh" style="color:#ea4b46;padding-bottom:10px">${y}년</div><div class="cxy" onpointerdown="cPD(event)" onpointerup="cPU(event)">${g}</div><div class="cxf"><i class="fp" onclick="cToday()" style="padding:0 18px">오늘</i></div>${cSheet()}`)}
 const f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),rows=Math.ceil((f+n)/7);
 if(!csel||csel.slice(0,7)!=`${y}-${pad(m+1)}`)csel=(T.getFullYear()==y&&T.getMonth()==m)?tk:dk(y,m,1);
 let c="";for(let i=0;i<rows*7;i++){const d=i-f+1;if(d<1||d>n){c+='<div class="cxd e"></div>';continue}const k=dk(y,m,d),w=i%7==0||i%7==6;c+=`<div class="cxd${w?" w":""}${k==tk?" t":""}${k==csel?" s":""}" onclick="cPick('${k}')"><b>${d}</b>${cDots(evOn(k))}</div>`}
 return wrap(`<div class="tr" style="padding:6px 16px 10px"><i class="fp" style="padding:0 18px 0 12px;gap:6px;font-size:17px" onclick="cV='y';go('cal')">${ic("back",20)}${y}년</i><span class="fp" style="padding:0 22px;gap:26px"><span>${svgs.list}</span><span>${ic("search",25,"#111")}</span><span onclick="cAdd()">${svgs.plus}</span></span></div><div class="cxh">${m+1}월</div><div class="cxw">${[...W].map(w=>`<span>${w}</span>`).join("")}</div><div onpointerdown="cPD(event)" onpointerup="cPU(event)"><div class="cxg">${c}</div></div><div class="cxl">${evS(evOn(csel)).map(cRow).join("")}</div><div class="cxf"><i class="fp" onclick="cToday()" style="padding:0 18px">오늘</i><span class="fp" style="padding:0 22px;gap:28px"><span>${svgs.exc}</span><span>${svgs.tray}</span></span></div>${cSheet()}`)};

 const body=muV=="lib"?`<div class="hd" style="padding:6px 18px 10px"><b style="font-size:38px;flex:1">보관함</b><i class="fp" style="margin-right:10px;gap:22px">${ic("pl",24)}${ic("dots",24)}</i><div class="av" style="width:56px;height:56px;overflow:hidden;position:relative;${ph(9)}">${im(M.avatar)}</div></div>${rw(ic("pl",26,"#fa2d48"),"플레이리스트","pl")}${rw(ic("art",26,"#fa2d48"),"아티스트")}${rw(ic("alb",26,"#fa2d48"),"앨범")}${rw(ic("note",26,"#fa2d48"),"노래","sg")}${rw(ic("dl",26,"#fa2d48"),"다운로드됨")}<div style="padding:26px 18px 10px;font-size:23px;font-weight:700">최근 추가된 항목</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 18px"><div onclick="muV='pl';go('music')">${cov({cover:M.cover},3,"100%",14)}<div style="margin-top:6px">${M.playlist}</div><small style="color:#8e8e93">${M.user}</small></div><div><div class="ph" style="width:100%;border-radius:14px;display:grid;place-items:center;font-size:90px;color:#e63946;background:#eaeded">★</div><div style="margin-top:6px">즐겨찾는 노래 <span style="color:#e63946">★</span></div><small style="color:#8e8e93">${M.user}</small></div></div>`
 :`<div class="hd" onclick="muV='lib';go('music')" style="color:#fa2d48">‹ 보관함</div>${muV=="pl"?`<div style="text-align:center;padding:6px 60px 14px">${cov({cover:M.cover},3,"100%",14)}<div style="font-size:22px;font-weight:700;margin-top:12px">${M.playlist}</div><small style="color:#8e8e93">${M.user}</small></div>`:`<div class="hd"><b style="font-size:32px">노래</b></div>`}${list}`;
 return wrap(`<div class="sc" style="padding-bottom:10px">${body}</div><div class="mp">${cov(s,mCur,"44px",6)}<div class="fl"><b style="font-weight:600">${s.t}</b><small style="font-size:14px">${s.a}</small></div><span onclick="mTog()" style="font-size:26px;cursor:pointer">${mPl?ic("pause",28,"#000","#000",0):ic("play",28,"#000","#000",0)}</span><span onclick="mPlay((mCur+1)%${ss.length})" style="font-size:26px;cursor:pointer">${ic("ff",30,"#000","#000",0)}</span></div><div class="mtb"><div><span>${ic("home",28,"#111","#111",0)}<br>홈</span><span>${ic("grid4",28,"#111","#111",0)}<br>새로운 음악</span><span>${ic("radio",28,"#555")}<br>라디오</span><span class="a">${ic("lib",28,"#fa2d48","#fa2d48",0)}<br>보관함</span></div><div class="s">${ic("search",28,"#111")}</div></div>`)};
